[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "poker-collusion-detection"
version = "0.1.0"
description = "Evidence-first PU learning baseline for the Kaggle suspicious poker value-transfer challenge"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "polars>=1.20",
  "pyarrow>=17",
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "lightgbm>=4.5",
  "joblib>=1.4",
  "PyYAML>=6.0",
  "typer>=0.12",
  "rich>=13.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
